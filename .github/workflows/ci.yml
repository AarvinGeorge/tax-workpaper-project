# Unit tests, typecheck, SSN scan and the AI eval gate on every push and pull request. No secrets: the eval gate scores
# the committed eval payload (project-build/ai/eval/ai-suggestions.json); it never calls a model.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project-build/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: SSN scan
        run: node scripts/scan-ssn.mjs src tests scripts ai
      - name: AI eval gate
        run: npx tsx ai/harness.ts --check
